name: dependabot-auto-merge
on: pull_request_target

permissions:
  contents: read

jobs:
  dependabot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.actor == 'dependabot[bot]' }}
    permissions:
      pull-requests: write
      contents: write
      checks: read
      statuses: read
    steps:

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Squash-merge minor and patch updates once CI passes
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch' }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Give the PR's own workflows time to register their checks.
          sleep 60
          while true; do
            checks=$(gh pr view "$PR_URL" --json statusCheckRollup --jq '[.statusCheckRollup[]
              | select((.name // .context) != "dependabot")
              | {name: (.name // .context),
                 done: ((.status // "COMPLETED") == "COMPLETED" and (.state // "") != "PENDING" and (.state // "") != "EXPECTED"),
                 result: (.conclusion // .state)}]')
            if [ "$(jq length <<<"$checks")" -eq 0 ]; then
              echo "No CI checks found on this PR; leaving it for a manual merge."
              exit 1
            fi
            if [ "$(jq '[.[] | select(.done | not)] | length' <<<"$checks")" -gt 0 ]; then
              sleep 30
              continue
            fi
            failed=$(jq -r '.[] | select(.result | IN("SUCCESS", "SKIPPED", "NEUTRAL") | not) | "\(.name): \(.result)"' <<<"$checks")
            if [ -n "$failed" ]; then
              echo "CI did not pass; leaving the PR open:"
              echo "$failed"
              exit 1
            fi
            break
          done
          gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
